    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080705" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />

    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" sizes="any" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5/index.min.css" />

  </head>
